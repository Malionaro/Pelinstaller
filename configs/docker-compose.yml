x-common:
  database:
    &db-environment
    MARIADB_PASSWORD: &db-password "<db_password>"
    MARIADB_ROOT_PASSWORD: "<db_root_password>"
  panel:
    &panel-environment
    APP_URL: "<app_url>"
    APP_DEBUG: "false"
    APP_ENV: "production"
    APP_ENVIRONMENT_ONLY: "false"
    APP_INSTALLED: "true"
    APP_TIMEZONE: "<timezone>"
    LE_EMAIL: "<le_email>"
  mail:
    &mail-environment
    MAIL_MAILER: "log"

services:
  database:
    image: mariadb:12
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "./database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MARIADB_DATABASE: "panel"
      MARIADB_USER: "pelican"
  cache:
    image: redis:alpine
    restart: always
  panel:
    user: "0:0"
    image: ghcr.io/pelican-dev/panel:latest
    restart: unless-stopped
    networks:
      - default
    ports:
      - "80:80"
      - "443:443"
    links:
      - database
      - cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./data:/pelican-data"
      - "./logs:/var/www/html/storage/logs"
      - "./plugins:/var/www/html/plugins"
    environment:
      <<: [*panel-environment, *mail-environment]
      XDG_DATA_HOME: /pelican-data
      DB_CONNECTION: "mariadb"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pelican"
      DB_PASSWORD: *db-password
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
